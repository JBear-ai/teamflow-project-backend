name: Backend membership tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: membership_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptest-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TEAMFLOW_MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/membership_test?allowPublicKeyRetrieval=true&useSSL=false
      TEAMFLOW_MYSQL_MIGRATION_URL: jdbc:mysql://127.0.0.1:3306/migration_test?allowPublicKeyRetrieval=true&useSSL=false
      TEAMFLOW_MYSQL_TEST_USER: root
      TEAMFLOW_MYSQL_TEST_PASSWORD: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
      - name: Create disposable migration schema
        run: docker exec ${{ job.services.mysql.id }} mysql -uroot -ptest-only -e 'CREATE DATABASE migration_test'
      - run: bash gradlew test --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: build/reports/tests/test
